/* ---------- AI 3: smart scheduler / AI 4: replanning ---------- */
const STEPS=[['ทำความเข้าใจโจทย์และค้นคว้า',.25],['ร่างโครงและเนื้อหา',.4],['ลงมือทำหลัก / ปรับปรุง',.25],['ตรวจทานก่อนส่ง',.1]];
function schedule(explain){const T=today(),keep=D.plan.filter(b=>b.done||b.date<T),used={};keep.forEach(b=>used[b.date]=(used[b.date]||0)+b.h);
 const cap=d=>Math.max(0,D.free[dt(d).getDay()]*.8-(used[d]||0)); /* เผื่อ 20% สำหรับเหตุไม่คาดคิด + พัก */
 const ts=D.tasks.filter(t=>!t.done).map(t=>({...t,rem:Math.max(0,t.hours-keep.filter(b=>b.tid==t.id).reduce((s,b)=>s+b.h,0))})).filter(t=>t.rem>0).sort((a,b)=>a.due.localeCompare(b.due)||b.diff-a.diff);
 const out=[],ex=[];
 ts.forEach((t,i)=>{let d=T,short=false;const last=t.due>T?add(t.due,-1):T,days=Math.round((dt(t.due)-dt(T))/864e5);
  STEPS.forEach(([name,r])=>{let need=Math.max(.5,Math.round(t.rem*r*4)/4);while(need>.01){if(d>last){short=true;break}const c=Math.min(Math.round(cap(d)*4)/4,need,1.5);if(c<.25){d=add(d,1);continue}
   out.push({id:Math.random().toString(36).slice(2),tid:t.id,date:d,h:c,step:name,done:false});used[d]=(used[d]||0)+c;need-=c}});
  ex.push(`${i+1}. ${t.title} (${t.subject}) — ส่งอีก ${days} วัน เหลือ ${t.rem.toFixed(1)} ชม. ความยาก ${t.diff}/5${short?' ⚠ เวลาว่างไม่พอ ควรเพิ่มเวลาว่างหรือขอเลื่อน':''}`)});
 D.plan=[...keep,...out];if(explain!==false)D.explain=ex;save()}
function replan(){const before=D.plan.filter(b=>!b.done&&b.date>=today()).length;schedule(true);D.explain.unshift(`จัดใหม่เมื่อ ${new Date().toLocaleTimeString(LOC(),{hour:'2-digit',minute:'2-digit'})} — เก็บงานที่ทำแล้ว ล้างบล็อกเดิม ${before} รายการ แล้วเรียงตามกำหนดส่งก่อน ความยากรองลงมา`);save();go('plan')}

function loadWeeks(){const T=today(),d0=dt(T),mon=add(T,-((d0.getDay()+6)%7)),W=[];for(let w=0;w<6;w++)W.push({s:add(mon,w*7),dem:0,cap:0,tasks:{}});
 for(const W_ of W)for(let i=0;i<7;i++){const d=add(W_.s,i);if(d>=T)W_.cap+=D.free[dt(d).getDay()]}
 D.tasks.filter(t=>!t.done).forEach(t=>{const done=D.plan.filter(b=>b.tid==t.id&&b.done).reduce((s,b)=>s+b.h,0),rem=Math.max(0,t.hours-done),n=Math.max(1,Math.round((dt(t.due)-dt(T))/864e5)),wt=1+(t.diff-3)*.15;
  for(let i=0;i<n;i++){const d=add(T,i),w=W.find(x=>d>=x.s&&d<add(x.s,7));if(w){w.dem+=rem/n*wt;w.tasks[t.title]=1}}});
 return W}

/* ---------- AI 1: extractor ---------- */
function extract(txt){const ms=MN.map((m,i)=>m+'|'+['ม\\.ค\\.','ก\\.พ\\.','มี\\.ค\\.','เม\\.ย\\.','พ\\.ค\\.','มิ\\.ย\\.','ก\\.ค\\.','ส\\.ค\\.','ก\\.ย\\.','ต\\.ค\\.','พ\\.ย\\.','ธ\\.ค\\.'][i]).join('|');
 let due='',m;const yr=y=>{y=+y;return y>2400?y-543:y<100?y+2000:y};
 if(m=txt.match(new RegExp('(\\d{1,2})\\s*('+ms+')\\s*(\\d{2,4})?'))){const mi=MN.findIndex((n,i)=>new RegExp('^('+ms.split('|').slice(i*2,i*2+2).join('|')+')$').test(m[2]));const y=m[3]?yr(m[3]):new Date().getFullYear();if(mi>=0)due=y+'-'+String(mi+1).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0')}
 if(!due&&(m=txt.match(/(\d{1,2})\s*(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?,?\s*(\d{4})?/i))){const mi=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(m[2].toLowerCase());due=(m[3]||new Date().getFullYear())+'-'+String(mi+1).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0')}
 if(!due&&(m=txt.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/)))due=yr(m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
 const subj=(txt.match(/(?:วิชา|Course|course|Subject|subject)\s*[:：]?\s*([^\n,;]+)/)||txt.match(/\b([A-Z]{2,4}\s?\d{3,4}[^\n]*)/)||[])[1]||'',
 title=(txt.match(/(?:ชื่องาน|งาน|หัวข้อ|Task|task|Title|Assignment)\s*[:：]\s*([^\n]+)/)||[])[1]||txt.split('\n').find(l=>l.trim())||'',
 notes=txt.split('\n').filter(l=>/^\s*([-•*]|\d+[.)])/.test(l)).map(l=>l.trim()).join('\n'),
 pg=txt.match(/(\d+)\s*(?:หน้า|pages?)/),hr=txt.match(/(\d+)\s*(?:ชั่วโมง|ชม|hours?|hrs?)/);
 return{title:title.trim().slice(0,80),subject:subj.trim(),due,hours:hr?+hr[1]:pg?Math.max(2,Math.round(pg[1]*1.2)):4,notes}}

function vTasks(){const g={};D.tasks.forEach(t=>(g[t.subject||'ไม่ระบุวิชา']??=[]).push(t));const ks=Object.keys(g);
 $('#v').innerHTML=`<h2>งานของฉัน</h2><p class="sub">เลื่อนเมาส์เพื่อเอียงกระจก · คลิกเพื่อเปิดแฟ้ม · คลิกงานเพื่อดูรายละเอียด</p>${ks.length?`<div class="folders">${ks.map(s=>{const L=g[s].sort((a,b)=>a.due.localeCompare(b.due)).slice(0,4),n=L.length;return`<div class="fd" style="--h:${hue(s)}"><div class="bk"></div><div class="fs">${L.map((t,i)=>`<button class="sh" style="--s:${n<2?0:i/(n-1)*2-1};--d:${n-1-i};z-index:${i+1}" onclick="openT(${t.id})"><b>${t.done?'✓ ':''}${esc(t.title)}</b><small>ส่ง ${fmt(t.due)} · ${t.hours} ชม.</small><i class="ln" style="width:85%"></i><i class="ln" style="width:60%"></i><i class="ln" style="width:75%"></i></button>`).join('')}</div><div class="fr" tabindex="0" role="button" aria-label="เปิดแฟ้ม ${esc(s)}" onclick="this.parentNode.classList.toggle('o')" onkeydown="if(event.key=='Enter'||event.key==' '){event.preventDefault();this.click()}"><b>${esc(s)}</b><small>${g[s].length} งาน</small></div></div>`}).join('')}</div>`:'<div class="card">ยังไม่มีงาน — ไปที่ “เพิ่มงาน”</div>'}`}
function openT(id){const t=tk(id);$('#mc').innerHTML=`<h2>${esc(t.title)}</h2><p class="sub"><span class="tag">${esc(t.subject)}</span> ส่ง ${fmt(t.due)} · ${t.hours} ชม. · ความยาก ${t.diff}/5</p><p style="white-space:pre-wrap">${esc(t.notes)||'—'}</p><div style="display:flex;gap:8px;margin-top:16px"><button class="btn g" onclick="done(${id})">${t.done?'ยกเลิกเสร็จ':'ทำเสร็จแล้ว'}</button><button class="btn o" onclick="del(${id})">ลบ</button><button class="btn o" onclick="$('#md').classList.remove('on')">ปิด</button></div>`;$('#md').classList.add('on')}
const done=id=>{const t=tk(id);t.done=!t.done;save();replan0()},del=id=>{D.tasks=D.tasks.filter(t=>t.id!=id);D.plan=D.plan.filter(b=>b.tid!=id);save();replan0()};
const replan0=()=>{$('#md').classList.remove('on');schedule(true);go(view)};
$('#md').onclick=e=>{if(e.target.id=='md')$('#md').classList.remove('on')};
function vAdd(){$('#v').innerHTML=`<div class="grid g2"><div class="card"><h2>AI อ่านรายละเอียดงาน</h2><p class="sub">วางข้อความโจทย์ หรืออัปโหลดไฟล์ .txt/.md ที่ได้รับอนุญาตให้ใช้ AI — ระบบดึงชื่องาน วิชา วันส่ง และข้อกำหนดให้</p><textarea id="tx" rows="9" placeholder="วิชา: การตลาดดิจิทัล&#10;งาน: รายงานวิเคราะห์แบรนด์&#10;กำหนดส่ง 20 พ.ย. 2569&#10;- ความยาว 10 หน้า&#10;- อ้างอิง APA"></textarea><div style="display:flex;gap:8px;margin-top:10px"><label class="btn o" style="margin:0;color:var(--ink);cursor:pointer">อัปโหลดไฟล์<input type="file" accept=".txt,.md" hidden onchange="rd(this)"></label><button class="btn g" onclick="ai()">✨ ดึงข้อมูล</button></div></div>
 <div class="card"><h2>ข้อมูลงาน</h2><p class="sub">ตรวจสอบและแก้ไขก่อนบันทึก</p><label>ชื่องาน</label><input id="f1"><label>วิชา</label><input id="f2"><label>วันส่ง</label><input id="f3" type="date"><div class="grid" style="grid-template-columns:1fr 1fr"><div><label>ใช้เวลา (ชม.)</label><input id="f4" type="number" min="0.5" step="0.5" value="4"></div><div><label>ความยาก (1-5)</label><input id="f5" type="number" min="1" max="5" value="3"></div></div><label>ข้อกำหนดสำคัญ</label><textarea id="f6" rows="3"></textarea><button class="btn g" style="margin-top:14px;width:100%" onclick="addT()">บันทึกและจัดตาราง</button></div></div>`}
function rd(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#tx').value=String(r.result).slice(0,8000);ai()};r.readAsText(f)}
function ai(){const x=extract($('#tx').value);$('#f1').value=x.title;$('#f2').value=x.subject;$('#f3').value=x.due;$('#f4').value=x.hours;$('#f6').value=x.notes}
function addT(){const t={id:D.n++,title:$('#f1').value.trim(),subject:$('#f2').value.trim()||'ไม่ระบุวิชา',due:$('#f3').value,hours:+$('#f4').value||1,diff:Math.min(5,Math.max(1,+$('#f5').value||3)),notes:$('#f6').value};if(!t.title||!t.due)return alert(tr('กรุณากรอกชื่องานและวันส่ง'));D.tasks.push(t);schedule(true);go('plan')}
function vLoad(){const W=loadWeeks(),bad=W.filter(w=>w.cap&&w.dem/w.cap>.85);
 $('#v').innerHTML=`<h2>ภาระงานรายสัปดาห์</h2><p class="sub">เปรียบเทียบชั่วโมงที่ต้องใช้ (ถ่วงด้วยความยาก) กับเวลาว่างของคุณ</p>${bad.length?bad.map(w=>`<div class="warn">⚠ สัปดาห์ ${fmt(w.s)} ภาระสูงผิดปกติ (${Math.round(w.dem/w.cap*100)}% ของเวลาว่าง) — ควรเริ่มเตรียม ${fmt(add(w.s,-7))} · ${Object.keys(w.tasks).map(esc).join(', ')}</div>`).join(''):'<div class="ok">ภาระงานอยู่ในระดับที่จัดการได้ 🎉</div>'}<div class="card" style="margin-top:14px">${W.map(w=>{const r=w.cap?w.dem/w.cap:0,c=r>.85?'var(--r)':r>.6?'var(--y)':'var(--c)';return`<div class="row"><div style="width:90px;font-size:13px">${fmt(w.s)}</div><div class="bar" style="flex:1"><i style="width:${Math.min(100,r*100)}%;background:${c}"></i></div><div style="width:110px;text-align:right;font-size:13px;color:var(--mut)">${w.dem.toFixed(1)}/${w.cap} ชม.</div></div>`}).join('')}</div>`}
function vPlan(){const T=today(),days={};D.plan.filter(b=>b.date>=T).sort((a,b)=>a.date.localeCompare(b.date)).forEach(b=>(days[b.date]??=[]).push(b));
 $('#v').innerHTML=`<div class="grid g2"><div class="card"><div class="row" style="border:0;padding-top:0"><h2 style="flex:1">แผนทำงาน</h2><button class="btn g" onclick="replan()">↻ จัดใหม่</button></div><p class="sub">แบ่งงานเป็นขั้นตอน เว้นเวลา 20% สำหรับเหตุไม่คาดคิด และพักทุกชั่วโมง</p>${Object.keys(days).slice(0,14).map(d=>`<div style="margin:10px 0 2px;font-weight:500">${dt(d).toLocaleDateString(LOC(),{weekday:'short'})} ${fmt(d)}</div>${days[d].map(b=>{const t=tk(b.tid);return t?`<div class="row" style="padding:6px 0"><span class="dot" style="background:${col(t.subject)}"></span><span style="flex:1;font-size:14px;${b.done?'text-decoration:line-through;opacity:.5':''}">${esc(b.step)} · <span style="color:var(--mut)">${esc(t.title)}</span></span><span class="tag">${b.h} ชม.</span></div>`:''}).join('')}`).join('')||'<p class="sub">ยังไม่มีแผน</p>'}</div>
 <div class="grid" style="align-content:start"><div class="card"><h2>ทำไมเรียงแบบนี้</h2><p class="sub">AI อธิบายลำดับความสำคัญ</p><div style="font-size:14px;white-space:pre-wrap">${D.explain.map(esc).join('\n\n')||'—'}</div></div>
 <div class="card"><h2>เวลาว่างต่อวัน (ชม.)</h2><p class="sub">แก้ไขแล้วกด “จัดใหม่”</p><div class="free">${WD().map((x,i)=>`<div><div class="hrs" style="text-align:center">${x}</div><input type="number" min="0" max="16" step="0.5" value="${D.free[i]}" onchange="D.free[${i}]=+this.value;save()"></div>`).join('')}</div></div>
 <div class="card"><h2>🚨 มีงานด่วน?</h2><p class="sub">เพิ่มงานแล้วระบบจะจัดใหม่ทั้งหมดให้</p><button class="btn o" onclick="go('add')">เพิ่มงานด่วน</button></div></div></div>`}
const m=ld('sp_me',null);m&&ld('sp_users',{})[m]?boot(m):authUI(false);
</script></body></html>
